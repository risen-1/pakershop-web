name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download static site (no PHP) from the Cloudflare build
        run: |
          python3 - <<'EOF'
          import os, urllib.parse, urllib.request
          src = "https://pakershop-site.pages.dev/"
          def get(path):
              url = src + urllib.parse.quote(path)
              req = urllib.request.Request(url, headers={"User-Agent": "pakershop-pages-sync"})
              err = None
              for _ in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=60) as r:
                          return r.read()
                  except Exception as e:
                      err = e
              raise err
          files = [l.strip() for l in get("__files.txt").decode().splitlines() if l.strip()]
          for f in files:
              if f == "__files.txt" or f.endswith(".php"):
                  continue
              dest = os.path.join("site", f)
              os.makedirs(os.path.dirname(dest) or "site", exist_ok=True)
              with open(dest, "wb") as out:
                  out.write(get(f))
          open("site/.nojekyll", "w").close()
          with open("site/CNAME", "w") as c:
              c.write("pakershop.com\n")
          print("downloaded", len(files), "files")
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
